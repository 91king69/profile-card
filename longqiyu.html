<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>个人信息</title>
<style>
  :root {
    --page-bg: #eff2f6;
    --group-bg: #ffffff;
    --row-press: #eceef2;
    --label: #141414;
    --value: #6e6e6e;
    --hint: #9b9b9b;
    --desc: #6e6e6e;
    --orange: #ee8b4d;
    --green: #2ebd59;
    --divider: rgba(0, 0, 0, 0.07);
    --chevron: rgba(0, 0, 0, 0.22);
    --pad-l: 18px;
    --pad-r: 15px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    background: radial-gradient(1200px 600px at 50% 0%, #fafbfd 0%, #eaeef3 45%, #dee3e9 100%);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
                 "Helvetica Neue", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  /* ---------- 设备外框 ---------- */
  .phone {
    position: relative;
    width: 390px;
    max-width: 100%;
    height: 844px;
    max-height: 100%;
    background: var(--page-bg);
    border-radius: 44px;
    overflow: hidden;
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.10),
                0 0 0 10px #eceff3,
                0 0 0 11px rgba(0, 0, 0, 0.05),
                0 40px 90px rgba(25, 40, 65, 0.22);
  }

  /* ---------- 导航栏 ---------- */
  .nav {
    position: relative;
    height: 44px;
    display: flex;
    align-items: center;
    padding: 0 var(--pad-r) 0 15px;
    flex-shrink: 0;
  }

  .nav-back {
    width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-right: 22px;
    cursor: pointer;
    border-radius: 50%;
    transition: background 0.15s;
  }
  .nav-back:active { background: rgba(255, 255, 255, 0.1); }

  .nav-title {
    font-size: 19px;
    font-weight: 600;
    color: var(--label);
    letter-spacing: 0.3px;
  }

  /* ---------- 滚动区 ---------- */
  .screen {
    height: calc(100% - 44px);
    overflow-y: auto;
    overscroll-behavior: contain;
    padding-bottom: 40px;
    scrollbar-width: none;
  }
  .screen::-webkit-scrollbar { width: 0; height: 0; }

  /* ---------- 分组 ---------- */
  .group {
    background: var(--group-bg);
    margin-bottom: 9px;
  }

  /* ---------- 行 ---------- */
  .row {
    position: relative;
    display: flex;
    align-items: center;
    min-height: 52px;
    padding: 0 var(--pad-r) 0 var(--pad-l);
    cursor: pointer;
    transition: background 0.15s;
  }
  .row:active { background: var(--row-press); }

  .row + .row::before {
    content: "";
    position: absolute;
    left: var(--pad-l);
    right: 0;
    top: 0;
    height: 1px;
    background: var(--divider);
    transform: scaleY(0.6);
  }

  .label {
    font-size: 18px;
    color: var(--label);
    letter-spacing: 0.2px;
    flex-shrink: 0;
  }

  .spacer { flex: 1 1 auto; min-width: 12px; }

  .value {
    font-size: 16px;
    color: var(--value);
    text-align: right;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .value.is-orange { color: var(--orange); }
  .value.is-hint { color: var(--hint); }

  /* 多个值的容器（右侧区域） */
  .values {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
  }

  .chevron { flex-shrink: 0; margin-left: 8px; display: block; }

  /* ---------- 头像行 ---------- */
  .row-avatar { min-height: 96px; }

  .avatar {
    width: 64px;
    height: 64px;
    border-radius: 9px;
    object-fit: cover;
    display: block;
    background: #2a2a2a;
  }

  /* ---------- 最后的信息卡片 ---------- */
  .card {
    display: flex;
    align-items: center;
    padding: 14px var(--pad-r) 14px var(--pad-l);
    min-height: 96px;
    cursor: pointer;
    transition: background 0.15s;
    text-decoration: none;
    color: inherit;
  }
  .card:active { background: var(--row-press); }

  .card-main { min-width: 0; flex: 1 1 auto; }

  .card-title {
    font-size: 16.5px;
    color: var(--label);
    line-height: 1.35;
    letter-spacing: 0.2px;
  }

  .card-desc {
    margin-top: 5px;
    font-size: 13.5px;
    line-height: 1.6;
    color: var(--desc);
  }

  /* ---------- 绿勾 ---------- */
  .badge {
    width: 15px;
    height: 15px;
    flex-shrink: 0;
    display: block;
  }

  /* ---------- Home 指示条 ---------- */
  .home-bar {
    position: absolute;
    left: 50%;
    bottom: 8px;
    transform: translateX(-50%);
    width: 134px;
    height: 5px;
    border-radius: 3px;
    background: #1f1f1f;
    pointer-events: none;
  }

  /* ---------- 窄屏：铺满，交给浏览器原生滚动 ---------- */
  @media (max-width: 460px) {
    html, body { height: auto; }
    body { padding: 0; background: #eff2f6; display: block; }
    .phone {
      width: 100%;
      max-width: none;
      height: auto;
      min-height: 100vh;
      min-height: 100dvh;
      max-height: none;
      border-radius: 0;
      box-shadow: none;
      overflow: visible;
    }
    .nav {
      position: sticky;
      top: 0;
      z-index: 10;
      height: calc(44px + env(safe-area-inset-top));
      padding-top: env(safe-area-inset-top);
      background: rgba(247, 249, 251, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }
    .screen {
      height: auto;
      overflow: visible;
      padding-bottom: calc(34px + env(safe-area-inset-bottom));
    }
    .home-bar {
      position: fixed;
      bottom: calc(8px + env(safe-area-inset-bottom));
      z-index: 11;
      background: rgba(0, 0, 0, 0.28);
    }
  }
</style>
</head>
<body>

<main class="phone">
